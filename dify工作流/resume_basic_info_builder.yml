    - data:
        code: "import json\n\ndef safe_str(v):\n    if v is None:\n        return\
          \ \"\"\n    return str(v).strip()\n\ndef normalize_level(level):\n    level\
          \ = safe_str(level)\n    if level == \"研究生\":\n        return \"硕士\"\n \
          \   return level\n\ndef level_rank(level):\n    mapping = {\n        \"\
          专科\": 1,\n        \"本科\": 2,\n        \"硕士\": 3,\n        \"博士\": 4\n  \
          \  }\n    return mapping.get(normalize_level(level), 0)\n\nEDU_DURATION\
          \ = {\n    \"专科\": 3,\n    \"本科\": 4,\n    \"硕士\": 3,\n    \"博士\": 4\n}\n\
          \ndef empty_resume():\n    return {\n        \"基本信息\": {\n            \"\
          姓名\": \"\",\n            \"电话\": \"\",\n            \"邮箱\": \"\",\n    \
          \        \"专业\": \"\",\n            \"出生年月\": \"\",\n            \"毕业时间\"\
          : \"\",\n            \"政治面貌\": \"\",\n            \"求职意向\": \"\"\n     \
          \   },\n        \"教育经历\": [],\n        \"校园经历\": [],\n        \"实习经历\":\
          \ [],\n        \"项目经历\": []\n    }\n\ndef parse_json_text(text):\n    if\
          \ not text:\n        return {\n            \"基本信息\": {},\n            \"\
          教育经历\": []\n        }\n\n    text = text.strip()\n\n    # 去掉 think 块\n \
          \   if \"</think>\" in text:\n        text = text.split(\"</think>\", 1)[1].strip()\n\
          \n    # 直接解析\n    try:\n        return json.loads(text)\n    except:\n \
          \       pass\n\n    # 截取最外层 JSON\n    start = text.find(\"{\")\n    end\
          \ = text.rfind(\"}\")\n    if start != -1 and end != -1 and end > start:\n\
          \        candidate = text[start:end + 1]\n        try:\n            return\
          \ json.loads(candidate)\n        except:\n            pass\n\n    return\
          \ {\n        \"基本信息\": {},\n        \"教育经历\": []\n    }\n\ndef merge_basic_info(current,\
          \ incoming):\n    \"\"\"\n    直接覆盖类字段：\n    - 姓名\n    - 电话\n    - 邮箱\n \
          \   - 出生年月\n    - 政治面貌\n    - 求职意向\n\n    不直接覆盖：\n    - 专业\n    - 毕业时间\n\
          \    这两个字段后面由“最高学历教育经历”推导\n    \"\"\"\n    direct_fields = [\"姓名\", \"电话\"\
          , \"邮箱\", \"出生年月\", \"政治面貌\", \"求职意向\"]\n\n    for k in direct_fields:\n\
          \        v = safe_str(incoming.get(k, \"\"))\n        if v:\n          \
          \  current[k] = v\n\n    return current\n\ndef merge_education(current_list,\
          \ incoming_list):\n    \"\"\"\n    按 学历层级 合并：\n    - 本科 / 硕士 / 博士 / 专科\n\
          \    - 同层级更新\n    - 不同层级追加\n    \"\"\"\n    if not isinstance(current_list,\
          \ list):\n        current_list = []\n    if not isinstance(incoming_list,\
          \ list):\n        incoming_list = []\n\n    for edu in incoming_list:\n\
          \        if not isinstance(edu, dict):\n            continue\n\n       \
          \ edu_level = normalize_level(edu.get(\"学历层级\", \"\"))\n        edu[\"学历层级\"\
          ] = edu_level\n\n        if not edu_level:\n            continue\n\n   \
          \     matched = None\n        for old in current_list:\n            if normalize_level(old.get(\"\
          学历层级\", \"\")) == edu_level:\n                matched = old\n          \
          \      break\n\n        if matched is None:\n            current_list.append({\n\
          \                \"学历层级\": edu_level,\n                \"学校\": safe_str(edu.get(\"\
          学校\", \"\")),\n                \"专业\": safe_str(edu.get(\"专业\", \"\")),\n\
          \                \"开始时间\": safe_str(edu.get(\"开始时间\", \"\")),\n        \
          \        \"结束时间\": safe_str(edu.get(\"结束时间\", \"\"))\n            })\n \
          \       else:\n            for field in [\"学校\", \"专业\", \"开始时间\", \"结束时间\"\
          ]:\n                new_val = safe_str(edu.get(field, \"\"))\n         \
          \       if new_val:\n                    matched[field] = new_val\n\n  \
          \  return current_list\n\ndef infer_start_time(level, end_time):\n    level\
          \ = normalize_level(level)\n    end_time = safe_str(end_time)\n\n    if\
          \ not level or not end_time:\n        return \"\"\n\n    duration = EDU_DURATION.get(level)\n\
          \    if not duration:\n        return \"\"\n\n    # 提取年份，例如：\n    # 2022\
          \ / 2022年 / 2022-06 / 2022年6月\n    digits = \"\".join(ch for ch in end_time\
          \ if ch.isdigit())\n    if len(digits) < 4:\n        return \"\"\n\n   \
          \ year = int(digits[:4])\n    start_year = year - duration\n\n    return\
          \ f\"{start_year}年9月\"\n\ndef fill_education_time(current_list):\n    if\
          \ not isinstance(current_list, list):\n        return current_list\n\n \
          \   for edu in current_list:\n        if not isinstance(edu, dict):\n  \
          \          continue\n\n        level = normalize_level(edu.get(\"学历层级\"\
          , \"\"))\n        start_time = safe_str(edu.get(\"开始时间\", \"\"))\n     \
          \   end_time = safe_str(edu.get(\"结束时间\", \"\"))\n\n        # 缺开始时间但有结束时间时，自动反推\n\
          \        if not start_time and end_time:\n            inferred = infer_start_time(level,\
          \ end_time)\n            if inferred:\n                edu[\"开始时间\"] = inferred\n\
          \n    return current_list\n\ndef get_highest_education(edu_list):\n    if\
          \ not isinstance(edu_list, list) or not edu_list:\n        return None\n\
          \n    sorted_list = sorted(\n        edu_list,\n        key=lambda x: level_rank(x.get(\"\
          学历层级\", \"\")),\n        reverse=True\n    )\n    return sorted_list[0]\
          \ if sorted_list else None\n\ndef sync_highest_education_end_from_basic_info(current):\n\
          \    \"\"\"\n    如果最高学历教育经历缺少结束时间，而顶部基本信息里已有毕业时间，\n    则优先回填给最高学历教育经历。\n\
          \    \"\"\"\n    highest = get_highest_education(current.get(\"教育经历\", []))\n\
          \    if not highest:\n        return current\n\n    edu_end = safe_str(highest.get(\"\
          结束时间\", \"\"))\n    basic_end = safe_str(current.get(\"基本信息\", {}).get(\"\
          毕业时间\", \"\"))\n\n    if not edu_end and basic_end:\n        highest[\"\
          结束时间\"] = basic_end\n\n    return current\n\ndef sync_basic_info_from_highest_education(current):\n\
          \    \"\"\"\n    用最高学历回填顶部展示字段：\n    - 专业\n    - 毕业时间\n    \"\"\"\n    highest\
          \ = get_highest_education(current.get(\"教育经历\", []))\n    if not highest:\n\
          \        return current\n\n    highest_major = safe_str(highest.get(\"专业\"\
          , \"\"))\n    highest_end = safe_str(highest.get(\"结束时间\", \"\"))\n\n  \
          \  if highest_major:\n        current[\"基本信息\"][\"专业\"] = highest_major\n\
          \n    if highest_end:\n        current[\"基本信息\"][\"毕业时间\"] = highest_end\n\
          \n    return current\n\ndef main(current_json, extracted_text):\n    # 解析当前完整简历\n\
          \    try:\n        current = json.loads(current_json) if current_json else\
          \ empty_resume()\n    except:\n        current = empty_resume()\n\n    if\
          \ not current:\n        current = empty_resume()\n\n    # 保底字段\n    template\
          \ = empty_resume()\n    for k, v in template.items():\n        if k not\
          \ in current:\n            current[k] = v\n\n    if \"基本信息\" not in current\
          \ or not isinstance(current[\"基本信息\"], dict):\n        current[\"基本信息\"\
          ] = template[\"基本信息\"]\n\n    if \"教育经历\" not in current or not isinstance(current[\"\
          教育经历\"], list):\n        current[\"教育经历\"] = []\n\n    # 解析本轮抽取结果\n    incoming\
          \ = parse_json_text(extracted_text)\n\n    # merge 基本信息（直接字段）\n    current[\"\
          基本信息\"] = merge_basic_info(\n        current[\"基本信息\"],\n        incoming.get(\"\
          基本信息\", {})\n    )\n\n    # merge 教育经历\n    current[\"教育经历\"] = merge_education(\n\
          \        current[\"教育经历\"],\n        incoming.get(\"教育经历\", [])\n    )\n\
          \n    # 如果顶部毕业时间已有，而最高学历缺结束时间，则回填\n    current = sync_highest_education_end_from_basic_info(current)\n\
