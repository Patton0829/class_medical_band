    - data:
        code: "import json\nfrom datetime import datetime\n\ndef normalize_list(value):\n\
          \    if value is None:\n        return []\n    if isinstance(value, list):\n\
          \        return [str(v).strip() for v in value if str(v).strip()]\n    if\
          \ isinstance(value, str):\n        value = value.strip()\n        if not\
          \ value:\n            return []\n        for sep in [\"，\", \",\", \"、\"\
          , \";\", \"；\"]:\n            if sep in value:\n                return [v.strip()\
          \ for v in value.split(sep) if v.strip()]\n        return [value]\n    return\
          \ [str(value).strip()]\n\ndef dedupe_list(items):\n    seen = set()\n  \
          \  result = []\n    for item in normalize_list(items):\n        if item\
          \ not in seen:\n            seen.add(item)\n            result.append(item)\n\
          \    return result\n\ndef safe_str(value):\n    if value is None:\n    \
          \    return \"\"\n    return str(value).strip()\n\ndef extract_json_from_text(text):\n\
          \    if not isinstance(text, str):\n        return {}\n    text = text.strip()\n\
          \    try:\n        return json.loads(text)\n    except:\n        pass\n\n\
          \    start = text.find(\"{\")\n    end = text.rfind(\"}\")\n    if start\
          \ != -1 and end != -1 and end > start:\n        candidate = text[start:end\
          \ + 1]\n        try:\n            return json.loads(candidate)\n       \
          \ except:\n            return {}\n    return {}\n\ndef normalize_project_item(item):\n\
          \    \"\"\"\n    把抽取器输出统一成项目对象格式\n    兼容两种情况：\n    1. {\"项目经历\":[{...}]}\n\
          \    2. {\"项目名称\":\"\", \"担任角色\":\"\", ...}\n    \"\"\"\n    if not isinstance(item,\
          \ dict):\n        return None\n\n    project = {\n        \"项目名称\": safe_str(item.get(\"\
          项目名称\", \"\")),\n        \"担任角色\": safe_str(item.get(\"担任角色\", \"\")),\n\
          \        \"开始时间\": safe_str(item.get(\"开始时间\", \"\")),\n        \"结束时间\"\
          : safe_str(item.get(\"结束时间\", \"\")),\n        \"项目背景\": safe_str(item.get(\"\
          项目背景\", \"\")),\n        \"项目目标\": safe_str(item.get(\"项目目标\", \"\")),\n\
          \        \"职责\": dedupe_list(item.get(\"职责\", [])),\n        \"成果\": dedupe_list(item.get(\"\
          成果\", [])),\n        \"技术工具\": dedupe_list(item.get(\"技术工具\", [])),\n  \
          \      \"是否完成\": False,\n        \"信息完整度\": 0\n    }\n    return project\n\
          \ndef merge_project(current, incoming):\n    str_fields = [\"项目名称\", \"\
          担任角色\", \"开始时间\", \"结束时间\", \"项目背景\", \"项目目标\"]\n    list_fields = [\"职责\"\
          , \"成果\", \"技术工具\"]\n\n    for field in str_fields:\n        old_val = safe_str(current.get(field,\
          \ \"\"))\n        new_val = safe_str(incoming.get(field, \"\"))\n      \
          \  if not old_val and new_val:\n            current[field] = new_val\n \
          \       elif old_val and new_val and len(new_val) > len(old_val) and new_val\
          \ not in old_val:\n            current[field] = new_val\n\n    for field\
          \ in list_fields:\n        old_list = dedupe_list(current.get(field, []))\n\
          \        new_list = dedupe_list(incoming.get(field, []))\n        merged\
          \ = old_list[:]\n        for item in new_list:\n            if item not\
          \ in merged:\n                merged.append(item)\n        current[field]\
          \ = merged\n\n    if \"行动\" in current:\n        del current[\"行动\"]\n\n\
          \    return current\n\ndef calc_completeness(project):\n    \"\"\"\n   \
          \ 项目完整度评分（总分100）\n    - 项目名称：15\n    - 时间（开始/结束至少一个）：15\n    - 项目背景或项目目标：15\n\
          \    - 职责：25\n    - 成果：20\n    - 技术工具：10\n    \"\"\"\n    score = 0\n\n\
          \    if safe_str(project.get(\"项目名称\")):\n        score += 15\n\n    if\
          \ safe_str(project.get(\"开始时间\")) or safe_str(project.get(\"结束时间\")):\n\
          \        score += 15\n\n    if safe_str(project.get(\"项目背景\")) or safe_str(project.get(\"\
          项目目标\")):\n        score += 15\n\n    if dedupe_list(project.get(\"职责\"\
          , [])):\n        score += 25\n\n    if dedupe_list(project.get(\"成果\", [])):\n\
          \        score += 20\n\n    if dedupe_list(project.get(\"技术工具\", [])):\n\
          \        score += 10\n\n    return score\n\ndef finalize_project(project):\n\
          \    if not isinstance(project, dict):\n        return project\n\n    if\
          \ \"行动\" in project:\n        del project[\"行动\"]\n\n    project[\"职责\"\
          ] = dedupe_list(project.get(\"职责\", []))\n    project[\"成果\"] = dedupe_list(project.get(\"\
          成果\", []))\n    project[\"技术工具\"] = dedupe_list(project.get(\"技术工具\", []))\n\
          \    project[\"信息完整度\"] = calc_completeness(project)\n\n    # 时间作为强约束：没有开始和结束时间都不允许\
          \ ready\n    has_time = bool(safe_str(project.get(\"开始时间\")) or safe_str(project.get(\"\
          结束时间\")))\n    project[\"是否完成\"] = project[\"信息完整度\"] >= 85 and has_time\n\
          \n    return project\n\ndef contains_new_project_signal(user_message):\n\
          \    text = safe_str(user_message)\n    signals = [\n        \"我还有一个\",\n\
          \        \"另外一个项目\",\n        \"另一个项目\",\n        \"还做过一个项目\",\n       \
          \ \"还有一个项目\",\n        \"此外我还做过\",\n        \"另外我还做过\"\n    ]\n    return\
          \ any(s in text for s in signals)\n\ndef project_signature(project):\n \
          \   \"\"\"\n    用于粗粒度判断两个项目是否明显不同\n    \"\"\"\n    name = safe_str(project.get(\"\
          项目名称\", \"\"))\n    role = safe_str(project.get(\"担任角色\", \"\"))\n    techs\
          \ = \"|\".join(dedupe_list(project.get(\"技术工具\", []))[:3])\n    return f\"\
          {name}__{role}__{techs}\"\n\ndef is_new_project(current_project, incoming_project,\
          \ user_message=\"\"):\n    \"\"\"\n    判定本轮输入是否应新建项目，而不是合并到当前项目。\n    规则（满足任一即可视为新项目）：\n\
          \    1. 用户文本里明确说“我还有一个项目”等\n    2. incoming 有明确项目名称，且与 current 名称不同\n  \
          \  3. 当前项目已完成，incoming 又带有明显不同的项目名称/角色/技术栈组合\n    \"\"\"\n    if contains_new_project_signal(user_message):\n\
          \        return True\n\n    current_name = safe_str(current_project.get(\"\
          项目名称\", \"\"))\n    incoming_name = safe_str(incoming_project.get(\"项目名称\"\
          , \"\"))\n\n    if incoming_name and current_name and incoming_name != current_name:\n\
          \        return True\n\n    current_done = bool(current_project.get(\"是否完成\"\
          , False))\n    if current_done:\n        current_sig = project_signature(current_project)\n\
          \        incoming_sig = project_signature(incoming_project)\n        if\
          \ incoming_name and incoming_sig and incoming_sig != current_sig:\n    \
          \        return True\n\n    return False\n\ndef init_resume():\n    return\
          \ {\n        \"项目经历\": [],\n        \"当前项目索引\": 0,\n        \"待追问问题\": [],\n\
          \        \"最近一次更新\": \"\"\n    }\n\ndef main(resume_json=None, extract_result=None,\
          \ user_message=None):\n    # 1. 初始化 / 解析 resume_json\n    if not resume_json:\n\
          \        resume = init_resume()\n    else:\n        if isinstance(resume_json,\
          \ str):\n            try:\n                resume = json.loads(resume_json)\n\
          \            except:\n                resume = init_resume()\n        else:\n\
          \            resume = resume_json\n\n    if not isinstance(resume, dict):\n\
          \        resume = init_resume()\n\n    if \"项目经历\" not in resume or not\
          \ isinstance(resume[\"项目经历\"], list):\n        resume[\"项目经历\"] = []\n \
          \   if \"当前项目索引\" not in resume:\n        resume[\"当前项目索引\"] = 0\n    if\
          \ \"待追问问题\" not in resume or not isinstance(resume[\"待追问问题\"], list):\n\
          \        resume[\"待追问问题\"] = []\n    if \"最近一次更新\" not in resume:\n    \
          \    resume[\"最近一次更新\"] = \"\"\n\n    # 兼容旧项目中残留的“行动”\n    for p in resume[\"\
          项目经历\"]:\n        if isinstance(p, dict) and \"行动\" in p:\n            del\
          \ p[\"行动\"]\n\n    # 2. 解析 extract_result\n    if not extract_result:\n\
          \        increment = {}\n    elif isinstance(extract_result, str):\n   \
          \     increment = extract_json_from_text(extract_result)\n    else:\n  \
          \      increment = extract_result\n\n    # 3. 兼容两种抽取结构\n    incoming_project\
          \ = None\n\n    # 情况 A：标准结构 {\"项目经历\":[{...}]}\n    if isinstance(increment,\
          \ dict) and \"项目经历\" in increment:\n        projects = increment.get(\"\
          项目经历\", [])\n        if isinstance(projects, list) and len(projects) > 0\
          \ and isinstance(projects[0], dict):\n            incoming_project = normalize_project_item(projects[0])\n\
          \n    # 情况 B：扁平结构 {\"项目名称\":\"\", \"成果\":[...], ...}\n    if incoming_project\
          \ is None and isinstance(increment, dict):\n        possible_keys = {\n\
          \            \"项目名称\", \"担任角色\", \"开始时间\", \"结束时间\",\n            \"项目背景\"\
          , \"项目目标\", \"职责\", \"成果\", \"技术工具\",\n            # 兼容旧 schema 残留\n   \
          \         \"行动\"\n        }\n        if any(k in increment for k in possible_keys):\n\
          \            incoming_project = normalize_project_item(increment)\n\n  \
          \  # 4. 没抽到有效项目，直接返回旧状态\n    if incoming_project is None:\n        resume[\"\
          最近一次更新\"] = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        return\
          \ {\n            \"result\": json.dumps(resume, ensure_ascii=False)\n  \
          \      }\n\n    # 5. 如果没有项目，直接创建第一个\n    if not resume[\"项目经历\"]:\n    \
          \    incoming_project = finalize_project(incoming_project)\n        resume[\"\
          项目经历\"] = [incoming_project]\n        resume[\"当前项目索引\"] = 0\n\n    else:\n\
          \        idx = resume.get(\"当前项目索引\", 0)\n        if idx >= len(resume[\"\
          项目经历\"]):\n            idx = len(resume[\"项目经历\"]) - 1\n\n        current_project\
          \ = resume[\"项目经历\"][idx]\n\n        # 判断是补充当前项目，还是新增新项目\n        if is_new_project(current_project,\
          \ incoming_project, user_message=user_message):\n            incoming_project\
          \ = finalize_project(incoming_project)\n            resume[\"项目经历\"].append(incoming_project)\n\
          \            resume[\"当前项目索引\"] = len(resume[\"项目经历\"]) - 1\n        else:\n\
          \            merged_project = merge_project(current_project, incoming_project)\n\
          \            merged_project = finalize_project(merged_project)\n       \
          \     resume[\"项目经历\"][idx] = merged_project\n\n    resume[\"最近一次更新\"] =\
          \ datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n    return {\n     \
          \   \"result\": json.dumps(resume, ensure_ascii=False)\n    }"
