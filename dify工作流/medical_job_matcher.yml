    - data:
        code: "import json\nimport re\n\ndef extract_json_block(text: str) -> str:\n\
          \    text = str(text or \"\").strip()\n\n    # 去掉 markdown 代码块\n    code_block_match\
          \ = re.search(r\"```json\\s*(.*?)\\s*```\", text, re.DOTALL | re.IGNORECASE)\n\
          \    if code_block_match:\n        return code_block_match.group(1).strip()\n\
          \n    code_block_match = re.search(r\"```\\s*(.*?)\\s*```\", text, re.DOTALL)\n\
          \    if code_block_match:\n        return code_block_match.group(1).strip()\n\
          \n    return text\n\ndef safe_int(x, default=0):\n    try:\n        return\
          \ int(float(x))\n    except:\n        return default\n\ndef main(text: str):\n\
          \    cleaned = extract_json_block(text)\n\n    try:\n        data = json.loads(cleaned)\n\
          \    except:\n        return {\n            \"reranked_jobs\": \"[]\",\n\
          \            \"reranked_count\": 0\n        }\n\n    if not isinstance(data,\
          \ list):\n        return {\n            \"reranked_jobs\": \"[]\",\n   \
          \         \"reranked_count\": 0\n        }\n\n    deduped = []\n    seen\
          \ = set()\n\n    for item in data:\n        if not isinstance(item, dict):\n\
          \            continue\n\n        hospital = str(item.get(\"hospital\", \"\
          \")).strip()\n        department = str(item.get(\"department\", \"\")).strip()\n\
          \        position_name = str(item.get(\"position_name\", \"\")).strip()\n\
          \        final_score = safe_int(item.get(\"final_score\", 0))\n        rerank_reason\
          \ = str(item.get(\"rerank_reason\", \"\")).strip()\n\n        # 核心字段缺失则跳过\n\
          \        if not hospital or not department or not position_name:\n     \
          \       continue\n\n        dedup_key = f\"{hospital}_{department}_{position_name}\"\
          \n        if dedup_key in seen:\n            continue\n\n        seen.add(dedup_key)\n\
          \n        deduped.append({\n            \"rank\": len(deduped) + 1,\n  \
          \          \"hospital\": hospital,\n            \"department\": department,\n\
          \            \"position_name\": position_name,\n            \"final_score\"\
          : final_score,\n            \"rerank_reason\": rerank_reason\n        })\n\
          \n    return {\n        \"reranked_jobs\": json.dumps(deduped, ensure_ascii=False),\n\
          \        \"reranked_count\": len(deduped)\n    }"
