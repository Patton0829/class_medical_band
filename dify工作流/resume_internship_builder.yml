    - data:
        code: "import json\n\nVALID_DIMS = [\n    \"公司/单位\",\n    \"岗位角色\",\n    \"\
          时间\",\n    \"项目/业务背景\",\n    \"具体工作内容\",\n    \"技术栈/工具\"\n]\n\nCORE_DIMS\
          \ = [\"公司/单位\", \"岗位角色\", \"时间\", \"项目/业务背景\"]\n\ndef count_facts_by_prefix(facts,\
          \ prefix):\n    count = 0\n    for fact in facts:\n        if isinstance(fact,\
          \ str) and fact.startswith(prefix):\n            count += 1\n    return\
          \ count\n\ndef main(resume_json):\n    try:\n        data = json.loads(resume_json)\
          \ if isinstance(resume_json, str) else resume_json\n    except:\n      \
          \  data = {}\n\n    dim_status = data.get(\"_meta\", {}).get(\"实习维度状态\"\
          , {})\n    facts = data.get(\"实习经历\", [])\n\n    covered = []\n    pending\
          \ = []\n\n    for dim in VALID_DIMS:\n        status = dim_status.get(dim,\
          \ \"unknown\")\n        if status in [\"done\", \"none\"]:\n           \
          \ covered.append(dim)\n        else:\n            pending.append(dim)\n\n\
          \    # 核心基础维度必须全部完成\n    core_ok = all(dim_status.get(dim, \"unknown\")\
          \ == \"done\" for dim in CORE_DIMS)\n\n    # 深度判断\n    work_count = count_facts_by_prefix(facts,\
          \ \"具体工作内容:\")\n    tech_count = count_facts_by_prefix(facts, \"技术栈/工具:\"\
          )\n\n    # 满足以下其一才算深度足够\n    depth_ok = (\n        work_count >= 2 or\n\
          \        tech_count >= 2 or\n        len(facts) >= 7\n    )\n\n    ready\
          \ = core_ok and depth_ok\n\n    return {\n        \"covered_dims\": covered,\n\
          \        \"pending_dims\": pending,\n        \"is_ready\": ready\n    }"
        code_language: python3
        outputs:
