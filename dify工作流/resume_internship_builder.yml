    - data:
        code: "import json\n\nVALID_DIMS = [\n    \"公司/单位\",\n    \"岗位角色\",\n    \"\
          时间\",\n    \"项目/业务背景\",\n    \"具体工作内容\",\n    \"技术栈/工具\"\n]\n\nNEGATIVE_PATTERNS\
          \ = [\n    \"没有\",\n    \"没做过\",\n    \"未参与\",\n    \"未接触\",\n    \"无\"\n\
          ]\n\nFACT_PREFIX_TO_DIM = {\n    \"公司/单位：\": \"公司/单位\",\n    \"公司/单位:\"\
          : \"公司/单位\",\n    \"岗位角色：\": \"岗位角色\",\n    \"岗位角色:\": \"岗位角色\",\n    \"\
          时间：\": \"时间\",\n    \"时间:\": \"时间\",\n    \"项目/业务背景：\": \"项目/业务背景\",\n \
          \   \"项目/业务背景:\": \"项目/业务背景\",\n    \"具体工作内容：\": \"具体工作内容\",\n    \"具体工作内容:\"\
          : \"具体工作内容\",\n    \"技术栈/工具：\": \"技术栈/工具\",\n    \"技术栈/工具:\": \"技术栈/工具\"\
          ,\n}\n\ndef empty_resume():\n    return {\n        \"基本信息\": {},\n     \
          \   \"教育经历\": [],\n        \"校园经历\": [],\n        \"实习经历\": [],\n      \
          \  \"项目经历\": [],\n        \"_meta\": {\n            \"实习维度状态\": {\n    \
          \            \"公司/单位\": \"unknown\",\n                \"岗位角色\": \"unknown\"\
          ,\n                \"时间\": \"unknown\",\n                \"项目/业务背景\": \"\
          unknown\",\n                \"具体工作内容\": \"unknown\",\n                \"\
          技术栈/工具\": \"unknown\"\n            }\n        }\n    }\n\ndef normalize_list(v):\n\
          \    if isinstance(v, list):\n        return [str(x).strip() for x in v\
          \ if str(x).strip()]\n    if isinstance(v, str):\n        s = str(v).strip()\n\
          \        return [s] if s else []\n    return []\n\ndef is_positive_fact(fact):\n\
          \    fact = str(fact).strip()\n    if not fact:\n        return False\n\
          \    for p in NEGATIVE_PATTERNS:\n        if p in fact:\n            return\
          \ False\n    return True\n\ndef ensure_meta_structure(current):\n    if\
          \ \"_meta\" not in current or not isinstance(current[\"_meta\"], dict):\n\
          \        current[\"_meta\"] = {}\n\n    if \"实习维度状态\" not in current[\"\
          _meta\"] or not isinstance(current[\"_meta\"][\"实习维度状态\"], dict):\n    \
          \    current[\"_meta\"][\"实习维度状态\"] = empty_resume()[\"_meta\"][\"实习维度状态\"\
          ].copy()\n\n    # 兼容旧字段 meta，迁移到 _meta\n    if \"meta\" in current and isinstance(current[\"\
          meta\"], dict):\n        old_status = current[\"meta\"].get(\"实习维度状态\",\
          \ {})\n        if isinstance(old_status, dict):\n            for dim in\
          \ VALID_DIMS:\n                old_val = old_status.get(dim)\n         \
          \       if old_val in [\"done\", \"none\", \"unknown\"]:\n             \
          \       if current[\"_meta\"][\"实习维度状态\"].get(dim, \"unknown\") == \"unknown\"\
          :\n                        current[\"_meta\"][\"实习维度状态\"][dim] = old_val\n\
          \        del current[\"meta\"]\n\n    return current\n\ndef infer_dims_from_facts(facts):\n\
          \    inferred = set()\n    for fact in facts:\n        for prefix, dim in\
          \ FACT_PREFIX_TO_DIM.items():\n            if fact.startswith(prefix):\n\
          \                inferred.add(dim)\n                break\n    return inferred\n\
          \ndef main(current_json, structured_output):\n    try:\n        current\
          \ = json.loads(current_json) if current_json else empty_resume()\n    except:\n\
          \        current = empty_resume()\n\n    if not current or not isinstance(current,\
          \ dict):\n        current = empty_resume()\n\n    if \"实习经历\" not in current\
          \ or not isinstance(current[\"实习经历\"], list):\n        current[\"实习经历\"\
          ] = []\n\n    current = ensure_meta_structure(current)\n    dim_status =\
          \ current[\"_meta\"][\"实习维度状态\"]\n\n    if not isinstance(structured_output,\
          \ dict):\n        structured_output = {}\n\n    facts = normalize_list(structured_output.get(\"\
          新增实习事实\", []))\n    hit_dims = [x for x in normalize_list(structured_output.get(\"\
          命中维度\", [])) if x in VALID_DIMS]\n    none_dims = [x for x in normalize_list(structured_output.get(\"\
          明确没有的维度\", [])) if x in VALID_DIMS]\n\n    # 1) 合并正向事实\n    for fact in\
          \ facts:\n        if is_positive_fact(fact) and fact not in current[\"实习经历\"\
          ]:\n            current[\"实习经历\"].append(fact)\n\n    # 2) 从事实前缀兜底推断维度\n\
          \    inferred_dims = infer_dims_from_facts(facts)\n\n    # 3) 合并命中维度：显式命中\
          \ + 兜底推断\n    final_hit_dims = set(hit_dims) | inferred_dims\n\n    # 4)\
          \ 设置 done\n    for dim in final_hit_dims:\n        if dim in VALID_DIMS\
          \ and dim not in none_dims:\n            dim_status[dim] = \"done\"\n\n\
          \    # 5) 设置 none，但不能覆盖 done\n    for dim in none_dims:\n        if dim_status.get(dim)\
          \ != \"done\":\n            dim_status[dim] = \"none\"\n\n    return {\n\
          \        \"result\": json.dumps(current, ensure_ascii=False)\n    }"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
