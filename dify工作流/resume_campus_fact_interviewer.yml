    - data:
        code: "import json\n\nVALID_DIMS = [\n    \"学生组织/社团\",\n    \"竞赛\",\n    \"\
          科研/论文\",\n    \"奖学金/荣誉\",\n    \"志愿服务/活动\"\n]\n\ndef main(resume_json):\n\
          \    try:\n        data = json.loads(resume_json) if isinstance(resume_json,\
          \ str) else (resume_json or {})\n    except:\n        data = {}\n\n    meta\
          \ = data.get(\"_meta\", {})\n    dim_status = meta.get(\"校园维度状态\", {})\n\
          \n    covered = []\n    pending = []\n\n    for dim in VALID_DIMS:\n   \
          \     status = dim_status.get(dim, \"unknown\")\n        if status in [\"\
          done\", \"none\"]:\n            covered.append(dim)\n        else:\n   \
          \         pending.append(dim)\n\n    ready = len(pending) == 0\n\n    return\
          \ {\n        \"covered_dims\": covered,\n        \"pending_dims\": pending,\n\
          \        \"is_ready\": ready\n    }"
        code_language: python3
