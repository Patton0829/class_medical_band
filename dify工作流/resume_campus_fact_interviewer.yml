    - data:
        code: "import json\n\nVALID_DIMS = [\n    \"学生组织/社团\",\n    \"竞赛\",\n    \"\
          科研/论文\",\n    \"奖学金/荣誉\",\n    \"志愿服务/活动\"\n]\n\nNEGATIVE_PATTERNS = [\n\
          \    \"没有\",\n    \"没参加\",\n    \"未参加\",\n    \"没做过\",\n    \"未做过\",\n \
          \   \"没有做过\",\n    \"没发过\",\n    \"未发表\",\n    \"没有发表\",\n    \"没拿过\",\n\
          \    \"未获得\",\n    \"没有获得\",\n    \"无\"\n]\n\ndef empty_resume():\n    return\
          \ {\n        \"基本信息\": {},\n        \"教育经历\": [],\n        \"校园经历\": [],\n\
          \        \"实习经历\": [],\n        \"项目经历\": [],\n        \"_meta\": {\n  \
          \          \"校园维度状态\": {\n                \"学生组织/社团\": \"unknown\",\n  \
          \              \"竞赛\": \"unknown\",\n                \"科研/论文\": \"unknown\"\
          ,\n                \"奖学金/荣誉\": \"unknown\",\n                \"志愿服务/活动\"\
          : \"unknown\"\n            }\n        }\n    }\n\ndef normalize_list(v):\n\
          \    if isinstance(v, list):\n        return [str(x).strip() for x in v\
          \ if str(x).strip()]\n    if isinstance(v, str):\n        s = str(v).strip()\n\
          \        return [s] if s else []\n    return []\n\ndef is_positive_fact(fact):\n\
          \    fact = str(fact).strip()\n    if not fact:\n        return False\n\
          \    for p in NEGATIVE_PATTERNS:\n        if p in fact:\n            return\
          \ False\n    return True\n\ndef ensure_meta_structure(current):\n    if\
          \ \"_meta\" not in current or not isinstance(current[\"_meta\"], dict):\n\
          \        current[\"_meta\"] = {}\n\n    if \"校园维度状态\" not in current[\"\
          _meta\"] or not isinstance(current[\"_meta\"][\"校园维度状态\"], dict):\n    \
          \    current[\"_meta\"][\"校园维度状态\"] = empty_resume()[\"_meta\"][\"校园维度状态\"\
          ].copy()\n\n    # 兼容旧字段 meta，迁移到 _meta\n    if \"meta\" in current and isinstance(current[\"\
          meta\"], dict):\n        old_status = current[\"meta\"].get(\"校园维度状态\",\
          \ {})\n        if isinstance(old_status, dict):\n            for dim in\
          \ VALID_DIMS:\n                old_val = old_status.get(dim)\n         \
          \       if old_val in [\"done\", \"none\", \"unknown\"]:\n             \
          \       if current[\"_meta\"][\"校园维度状态\"].get(dim, \"unknown\") == \"unknown\"\
          :\n                        current[\"_meta\"][\"校园维度状态\"][dim] = old_val\n\
          \        del current[\"meta\"]\n\n    return current\n\ndef main(current_json,\
          \ structured_output):\n    try:\n        current = json.loads(current_json)\
          \ if current_json else empty_resume()\n    except:\n        current = empty_resume()\n\
          \n    if not current or not isinstance(current, dict):\n        current\
          \ = empty_resume()\n\n    if \"校园经历\" not in current or not isinstance(current[\"\
          校园经历\"], list):\n        current[\"校园经历\"] = []\n\n    current = ensure_meta_structure(current)\n\
          \    dim_status = current[\"_meta\"][\"校园维度状态\"]\n\n    if not isinstance(structured_output,\
          \ dict):\n        structured_output = {}\n\n    facts = normalize_list(structured_output.get(\"\
          新增校园事实\", []))\n    hit_dims = [x for x in normalize_list(structured_output.get(\"\
          命中维度\", [])) if x in VALID_DIMS]\n    none_dims = [x for x in normalize_list(structured_output.get(\"\
          明确没有的维度\", [])) if x in VALID_DIMS]\n\n    # 合并正向事实\n    for fact in facts:\n\
          \        if is_positive_fact(fact) and fact not in current[\"校园经历\"]:\n\
          \            current[\"校园经历\"].append(fact)\n\n    # 命中维度 -> done\n    #\
          \ 若同一维度同时在 none_dims 中，优先视为 none，不标记 done\n    for dim in hit_dims:\n  \
          \      if dim not in none_dims:\n            dim_status[dim] = \"done\"\n\
          \n    # 明确没有 -> none\n    # 但不能覆盖已经有正向事实的 done\n    for dim in none_dims:\n\
          \        if dim_status.get(dim) != \"done\":\n            dim_status[dim]\
          \ = \"none\"\n\n    return {\n        \"result\": json.dumps(current, ensure_ascii=False)\n\
          \    }"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
